name: MC-01 source audit

on:
  push:
    paths:
      - "README.md"
      - "AGENTS.md"
      - "books/**"
      - "integer-multiplication/workloads/reading/**"
      - "examples/autogenerated/reading-provenance/**"
      - ".github/workflows/mc01-source-audit.yml"
  pull_request:
    paths:
      - "README.md"
      - "AGENTS.md"
      - "books/**"
      - "integer-multiplication/workloads/reading/**"
      - "examples/autogenerated/reading-provenance/**"
      - ".github/workflows/mc01-source-audit.yml"

permissions:
  contents: read

jobs:
  checked-source-trails:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ITHON_PYTHON: /usr/bin/python3
      ITHON_CHECK_RECEIPT: ${{ runner.temp }}/mc01-frontend-checks.jsonl
    steps:
      - name: Check out the exact source head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Check out the pinned checked Ithon frontend
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: isomorphisms/ithon
          ref: 74ab6d6044b07b76a910978437a34a6b5ac6acda
          path: _mc01-tools/ithon
          persist-credentials: false
      # GitHub's shell is only the command-launch boundary. Maintained audit
      # and qualification logic executes through the pinned checked Ithon path.
      - name: Record the actual source commit
        shell: sh
        run: git -C "${{ github.workspace }}" show --no-patch --format=fuller HEAD
      - name: Qualify the checked host frontend
        shell: sh
        run: >-
          "${{ github.workspace }}/_mc01-tools/ithon/ithon"
          "${{ github.workspace }}/_mc01-tools/ithon/tests/qualify-host-control.pi"
          "${{ runner.temp }}/mc01-host-qualification.json"
      - name: Audit source trails and exercise fifteen refusal controls
        shell: sh
        working-directory: ${{ runner.temp }}
        run: >-
          "${{ github.workspace }}/_mc01-tools/ithon/ithon"
          "${{ github.workspace }}/integer-multiplication/workloads/reading/check_mc01.pi"
          --self-test "${{ github.workspace }}/_mc01-tools/ithon/ithon"
      - name: Retain qualification and exact-source checking receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mc01-source-audit-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/mc01-host-qualification.json
            ${{ runner.temp }}/mc01-frontend-checks.jsonl
