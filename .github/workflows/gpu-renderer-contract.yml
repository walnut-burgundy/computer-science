name: GPU renderer contract

on:
  push:
    paths:
      - "gpu-renderer-contract/**"
      - ".github/workflows/gpu-renderer-contract.yml"
  pull_request:
    paths:
      - "gpu-renderer-contract/**"
      - ".github/workflows/gpu-renderer-contract.yml"
  workflow_dispatch:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run dependency-free contract tests
        working-directory: gpu-renderer-contract
        run: python -m unittest -v test_contract.py
